<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081c15"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52b788" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2d6a4f" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad2)"/>
  <!-- Modern IoT Grid lines overlay -->
  <g stroke="#52b788" stroke-width="1.5" opacity="0.25">
    <line x1="0" y1="200" x2="1920" y2="200"/>
    <line x1="0" y1="400" x2="1920" y2="400"/>
    <line x1="0" y1="600" x2="1920" y2="600"/>
    <line x1="0" y1="800" x2="1920" y2="800"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>
  <!-- Glowing sensor nodes & connectivity rays -->
  <g fill="#74c69d">
    <circle cx="320" cy="400" r="10"/>
    <circle cx="320" cy="400" r="24" fill="none" stroke="#74c69d" stroke-width="2" opacity="0.6"/>
    <circle cx="960" cy="600" r="12"/>
    <circle cx="960" cy="600" r="30" fill="none" stroke="#74c69d" stroke-width="2" opacity="0.7"/>
    <circle cx="1600" cy="400" r="10"/>
    <circle cx="1600" cy="400" r="24" fill="none" stroke="#74c69d" stroke-width="2" opacity="0.6"/>
    <circle cx="640" cy="800" r="8"/>
    <circle cx="1280" cy="800" r="8"/>
  </g>
  <!-- Field perspective -->
  <path d="M0 650 L1920 650 L1920 1080 L0 1080 Z" fill="#1b4332" opacity="0.9"/>
  <path d="M100 1080 L800 650 M500 1080 L900 650 M1000 1080 L960 650 M1500 1080 L1020 650 M1850 1080 L1120 650" stroke="#52b788" stroke-width="3" opacity="0.4"/>
</svg>
