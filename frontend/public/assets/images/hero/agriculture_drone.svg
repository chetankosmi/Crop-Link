<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="droneSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081c15"/>
      <stop offset="60%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="sprayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b7e4c7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#droneSky)"/>
  <!-- Field below -->
  <path d="M0 720 Q500 650 1000 700 T1920 680 L1920 1080 L0 1080 Z" fill="#1b4332"/>
  <path d="M0 840 Q600 780 1200 830 T1920 800 L1920 1080 L0 1080 Z" fill="#081c15"/>
  <!-- Modern Agri Drone silhouette flying in center-top -->
  <g transform="translate(860, 320)">
    <!-- Main chassis -->
    <rect x="50" y="40" width="100" height="40" rx="20" fill="#f0fdf4" opacity="0.95"/>
    <circle cx="100" cy="60" r="14" fill="#2d6a4f"/>
    <!-- Quad arms -->
    <line x1="10" y1="10" x2="60" y2="50" stroke="#d8f3dc" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="10" x2="140" y2="50" stroke="#d8f3dc" stroke-width="8" stroke-linecap="round"/>
    <line x1="10" y1="110" x2="60" y2="70" stroke="#d8f3dc" stroke-width="8" stroke-linecap="round"/>
    <line x1="190" y1="110" x2="140" y2="70" stroke="#d8f3dc" stroke-width="8" stroke-linecap="round"/>
    <!-- Propellers with spin effect -->
    <ellipse cx="10" cy="10" rx="45" ry="8" fill="#74c69d" opacity="0.7"/>
    <ellipse cx="190" cy="10" rx="45" ry="8" fill="#74c69d" opacity="0.7"/>
    <ellipse cx="10" cy="110" rx="45" ry="8" fill="#74c69d" opacity="0.7"/>
    <ellipse cx="190" cy="110" rx="45" ry="8" fill="#74c69d" opacity="0.7"/>
    <!-- Nozzles & spray mist downward -->
    <path d="M70 90 L30 350 L110 350 Z" fill="url(#sprayGrad)"/>
    <path d="M130 90 L90 350 L170 350 Z" fill="url(#sprayGrad)"/>
  </g>
</svg>
